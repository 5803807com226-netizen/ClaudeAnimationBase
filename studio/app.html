<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สตูดิโอแอนิเมชัน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231C1B22%22/%3E%3Cpath d=%22M24 18l24 14-24 14z%22 fill=%22%23E8541E%22/%3E%3C/svg%3E">
<style>
  @font-face { font-family: Kanit; font-weight: 500; src: url(/files/assets/fonts/kanit-thai-500-normal.woff2) format('woff2'); unicode-range: U+0E00-0E7F; }
  @font-face { font-family: Kanit; font-weight: 500; src: url(/files/assets/fonts/kanit-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Kanit; font-weight: 700; src: url(/files/assets/fonts/kanit-thai-700-normal.woff2) format('woff2'); unicode-range: U+0E00-0E7F; }
  @font-face { font-family: Kanit; font-weight: 700; src: url(/files/assets/fonts/kanit-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Sarabun; font-weight: 400; src: url(/files/assets/fonts/sarabun-thai-400-normal.woff2) format('woff2'); unicode-range: U+0E00-0E7F; }
  @font-face { font-family: Sarabun; font-weight: 400; src: url(/files/assets/fonts/sarabun-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Sarabun; font-weight: 600; src: url(/files/assets/fonts/sarabun-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E00-0E7F; }
  @font-face { font-family: Sarabun; font-weight: 600; src: url(/files/assets/fonts/sarabun-latin-600-normal.woff2) format('woff2'); }
  :root {
    --bg: #F5F2EC; --panel: #FFFFFF; --panel2: #FBF9F5; --ink: #1F1D24; --muted: #6F6A78; --line: #E6E1D8; --side: #1C1B22; --side2: #26252E; --sideInk: #CFCBD6;
    --accent: #E8541E; --accentSoft: #FFF1EA; --teal: #1F7A68; --tealSoft: #E8F4F0; --bad: #C0392B; --badSoft: #FCEDEB; --warn: #B7791F; --warnSoft: #FDF5E6; --ok: #2E7D32; --okSoft: #EAF5EA;
    --code: #17161C; --r: 12px; --shadow: 0 1px 2px rgba(30,25,20,.05), 0 4px 14px rgba(30,25,20,.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.6 Sarabun, "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif; display: grid; grid-template-columns: 248px 1fr; }
  h1, h2, h3, .k { font-family: Kanit, Sarabun, sans-serif; font-weight: 500; }
  /* sidebar */
  nav { background: var(--side); color: var(--sideInk); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .brand { padding: 20px 20px 16px; } .brand .k { font-size: 20px; color: #fff; letter-spacing: .2px; } .brand .k b { color: var(--accent); font-weight: 700; } .brand small { display: block; color: #8F8A99; font-size: 12.5px; }
  .grp { padding: 10px 12px 2px; } .grp > div { font: 600 11.5px Sarabun, sans-serif; color: #7E7988; letter-spacing: .8px; padding: 0 10px 4px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 1px 0; border-radius: 9px; color: var(--sideInk); text-decoration: none; font-size: 15px; }
  nav a .i { width: 22px; text-align: center; font-size: 16px; } nav a:hover { background: var(--side2); color: #fff; }
  nav a.on { background: #fff; color: var(--ink); font-weight: 600; } nav a .cnt { margin-left: auto; font-size: 12px; background: #3A3844; color: #ddd; padding: 0 7px; border-radius: 99px; }
  nav a.on .cnt { background: var(--accentSoft); color: var(--accent); }
  .navfoot { margin-top: auto; padding: 14px; border-top: 1px solid #2E2D36; display: grid; gap: 8px; }
  .navfoot button { width: 100%; padding: 8px; border-radius: 9px; border: 1px solid #3A3844; background: none; color: #CFCBD6; font: inherit; cursor: pointer; } .navfoot button:hover { background: #3A2522; border-color: #6B2A24; color: #fff; }
  /* main */
  .main { min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 28px 12px; }
  .top h1 { margin: 0; font-size: 24px; } .top .sub { color: var(--muted); font-size: 14px; }
  .top .sp { flex: 1; } .pill { font-size: 12.5px; padding: 3px 11px; border-radius: 99px; background: #ECE8E0; color: var(--muted); white-space: nowrap; } .pill.ok { background: var(--okSoft); color: var(--ok); } .pill.no { background: var(--badSoft); color: var(--bad); }
  .content { flex: 1; overflow-y: auto; padding: 4px 28px 120px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 4px; font-size: 17.5px; display: flex; align-items: center; gap: 10px; } .card h2 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13.5px; }
  .card .lead { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .grid { display: grid; gap: 14px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } .g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  label { display: block; font-size: 13.5px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font: inherit; background: var(--panel2); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid #F6C3AE; border-color: var(--accent); background: #fff; }
  textarea { min-height: 140px; resize: vertical; }
  .row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .b { padding: 8px 15px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 14.5px; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .b:hover { border-color: #BDB6A6; background: #FCFBF8; } .b:disabled { opacity: .45; cursor: default; }
  .b.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; } .b.primary:hover { background: #D44812; }
  .b.dark { background: var(--ink); color: #fff; border-color: var(--ink); } .b.teal { background: var(--teal); color: #fff; border-color: var(--teal); }
  .b.big { font-size: 17px; padding: 11px 24px; } .b.sm { padding: 4px 10px; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; } .sp { flex: 1; }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14.5px; color: var(--ink); margin: 0; cursor: pointer; } .chk input { width: auto; }
  .muted { color: var(--muted); font-size: 14px; } .small { font-size: 13px; }
  .tag { display: inline-block; font-size: 12.5px; padding: 1px 9px; border-radius: 99px; background: #EFEBE3; color: var(--muted); margin: 0 4px 4px 0; }
  .tag.ok { background: var(--okSoft); color: var(--ok); } .tag.bad { background: var(--badSoft); color: var(--bad); } .tag.warn { background: var(--warnSoft); color: var(--warn); } .tag.acc { background: var(--accentSoft); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; } th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line); vertical-align: top; } th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td textarea { min-height: 56px; font-size: 14px; }
  .note { background: var(--panel2); border-left: 3px solid var(--teal); padding: 8px 12px; border-radius: 6px; font-size: 14.5px; margin: 6px 0; }
  .alert { padding: 10px 14px; border-radius: 10px; font-size: 14.5px; margin: 8px 0; } .alert.bad { background: var(--badSoft); color: #7A231A; } .alert.warn { background: var(--warnSoft); color: #6E4A0F; } .alert.ok { background: var(--okSoft); color: #1E4F21; } .alert.info { background: var(--tealSoft); color: #134A3F; }
  .empty { text-align: center; color: var(--muted); padding: 36px 20px; }
  img.sheet { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #fff; } video { width: 100%; max-height: 620px; border-radius: 10px; background: #000; }
  .stat { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
  .stat .d { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--ok); } .stat.no .d { background: var(--bad); } .stat b { display: block; font-weight: 600; } .stat span { color: var(--muted); font-size: 13px; word-break: break-word; }
  .tile { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 16px; cursor: pointer; text-decoration: none; color: inherit; display: block; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .tile:hover { transform: translateY(-2px); border-color: #D8CFC0; } .tile .ic { font-size: 26px; } .tile b { display: block; font-family: Kanit, sans-serif; font-weight: 500; font-size: 16.5px; margin-top: 6px; } .tile span { color: var(--muted); font-size: 13.5px; }
  .vid { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); } .vid video { border-radius: 0; max-height: 360px; } .vid div { padding: 10px 12px; } .vid code { font-size: 12px; color: var(--muted); word-break: break-all; }
  .scenes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; } .scene { width: 92px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; font-size: 12px; text-align: center; }
  .scene img { width: 100%; display: block; aspect-ratio: 9/16; object-fit: cover; background: #EEE; } .scene div { padding: 3px; } .scene.bad { border-color: var(--bad); } .scene.ok { border-color: #9FD0A3; }
  .cap { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel2); } .cap b { font-family: Kanit, sans-serif; font-weight: 500; } .cap p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; } .seg button { border: 0; background: #fff; padding: 6px 13px; font: inherit; font-size: 14px; cursor: pointer; color: var(--muted); } .seg button.on { background: var(--ink); color: #fff; }
  .rigbox { position: relative; background: repeating-conic-gradient(#F1EEE8 0% 25%, #FBFAF7 0% 50%) 50% / 22px 22px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; min-height: 420px; }
  canvas#rig { max-width: 100%; max-height: 560px; cursor: grab; touch-action: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; font-size: 13px; color: var(--muted); } .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .acts .a { display: grid; grid-template-columns: 1.6fr 90px 90px 34px; gap: 8px; margin-bottom: 6px; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; padding: 4px; }
  .pick button { border: 2px solid transparent; border-radius: 9px; background: #F4F1EB; padding: 4px; cursor: pointer; } .pick button.on { border-color: var(--accent); } .pick img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; } .pick small { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip { display: grid; grid-template-columns: 2fr 1fr 2fr 70px 70px 34px; gap: 6px; margin-bottom: 6px; }
  .projlist { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  /* job bar + log drawer */
  .jobbar { position: fixed; left: 248px; right: 0; bottom: 0; background: var(--code); color: #E7E3DA; z-index: 20; box-shadow: 0 -6px 20px rgba(0,0,0,.15); }
  .jobline { display: flex; align-items: center; gap: 12px; padding: 10px 22px; font-size: 14.5px; } .jobline .sp { flex: 1; }
  .jobline button { background: none; border: 1px solid #3F3D48; color: #E7E3DA; border-radius: 8px; padding: 4px 12px; font: inherit; font-size: 13.5px; cursor: pointer; } .jobline button:hover { background: #2A2932; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #77737F; flex: none; } .dot.running { background: #F0A030; animation: p 1s infinite; } .dot.done { background: #4CAF50; } .dot.failed { background: #E5533F; }
  @keyframes p { 50% { opacity: .3; } }
  .log { display: none; font: 12.5px/1.5 ui-monospace, Consolas, monospace; padding: 0 22px 14px; height: 300px; overflow: auto; white-space: pre-wrap; color: #D9D5CC; } .jobbar.open .log { display: block; }
  .toast { position: fixed; right: 22px; bottom: 70px; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14.5px; z-index: 30; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; } .toast.on { opacity: 1; transform: none; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } nav { position: static; height: auto; } .main { height: auto; } .jobbar { left: 0; } .clip, .acts .a { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<nav>
  <div class="brand"><div class="k">สตูดิโอ<b>แอนิเมชัน</b></div><small>เรื่อง → ภาพ → การเคลื่อนไหว → วิดีโอ</small></div>
  <div id="navlinks"></div>
  <div class="navfoot"><button onclick="quit()">⏻ ปิดโปรแกรม</button></div>
</nav>
<div class="main">
  <div class="top"><div><h1 id="ptitle">หน้าหลัก</h1><div class="sub" id="psub"></div></div><span class="sp"></span><span id="b-claude" class="pill">Claude…</span><span id="b-comfy" class="pill">ComfyUI…</span></div>
  <div class="content" id="page"></div>
</div>
<div class="jobbar" id="jobbar">
  <div class="jobline"><span id="jdot" class="dot"></span><span id="jname">ว่าง: ยังไม่มีงานที่กำลังทำ</span><span class="sp"></span><button onclick="toggleLog()" id="logbtn">ดูบันทึก ▴</button><button onclick="stopJob()">หยุดงาน</button></div>
  <div class="log" id="log"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (path, method = 'GET', data) => { const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: data ? JSON.stringify(data) : undefined }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); };
const fmtSize = b => b > 2 ** 20 ? (b / 2 ** 20).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
const fmtDate = t => new Date(t).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
let STATE = null, HEALTH = null, LOGN = 0, LOGTEXT = '', POLL = null, ONDONE = null;

// ---------- navigation: categories ----------
const PAGES = [
  ['เริ่มต้น', [['home', '🏠', 'หน้าหลัก', 'ภาพรวมของระบบและทางลัด']]],
  ['สร้างงาน', [['projects', '🎬', 'สร้างวิดีโอด้วย AI', 'เล่าเรื่อง → Opus กำกับ → ภาพ → วิดีโอ'], ['characters', '🧍', 'ตัวละครและท่าทาง', 'ทำโครงกระดูกจากภาพ แล้วสั่งท่าทาง'], ['artwork', '🖼️', 'ภาพประกอบ', 'ตรวจและสร้างภาพของแต่ละเรื่อง']]],
  ['ผลิตและผลงาน', [['render', '🎞️', 'เรนเดอร์', 'สร้างวิดีโอทีละฉาก แก้เฉพาะฉากที่พัง'], ['library', '📚', 'คลังวิดีโอ', 'วิดีโอทั้งหมดที่ทำเสร็จแล้ว']]],
  ['ข้อมูลอ้างอิง', [['presets', '✨', 'คลังเอฟเฟกต์และท่าทาง', 'ทุกอย่างที่เอนจินทำได้']]],
  ['ระบบ', [['connections', '🔌', 'การเชื่อมต่อ', 'Claude · ComfyUI · AutoCinematic'], ['health', '🩺', 'ตรวจสุขภาพระบบ', 'ทดสอบทั้งระบบ แล้วสรุปผ่าน/ไม่ผ่าน'], ['settings', '⚙️', 'ตั้งค่า', 'ที่อยู่โปรแกรมและตัวเลือก']]],
];
const PAGEINFO = Object.fromEntries(PAGES.flatMap(([, ps]) => ps.map(([id, i, t, s]) => [id, { i, t, s }])));
function drawNav() {
  const cur = location.hash.slice(1).split('/')[0] || 'home';
  $('#navlinks').innerHTML = PAGES.map(([g, ps]) => `<div class="grp"><div>${g}</div>${ps.map(([id, i, t]) => `<a href="#${id}" class="${cur === id ? 'on' : ''}"><span class="i">${i}</span>${t}${id === 'projects' && STATE?.projects?.length ? `<span class="cnt">${STATE.projects.length}</span>` : ''}</a>`).join('')}</div>`).join('');
}
async function route() {
  const [id, arg] = location.hash.slice(1).split('/'), page = PAGEINFO[id] ? id : 'home', P = PAGEINFO[page];
  drawNav(); $('#ptitle').textContent = P.t; $('#psub').textContent = P.s; ONDONE = null;
  $('#page').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try { await VIEWS[page](arg ? decodeURIComponent(arg) : null); } catch (e) { $('#page').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);

async function refreshState() {
  STATE = await api('/api/state');
  const bc = $('#b-claude'); bc.textContent = STATE.credentials ? 'Claude: พร้อม' : 'Claude: ยังไม่พร้อม'; bc.className = 'pill ' + (STATE.credentials ? 'ok' : 'no'); bc.title = STATE.model;
  drawNav();
}
async function refreshHealth(fresh) {
  HEALTH = await api('/api/ws/health' + (fresh ? '?fresh=1' : ''));
  const c = HEALTH.items.find(x => x.id === 'comfy'), bf = $('#b-comfy'); bf.textContent = c.ok ? 'ComfyUI: ออนไลน์' : 'ComfyUI: ออฟไลน์'; bf.className = 'pill ' + (c.ok ? 'ok' : 'no'); bf.title = c.detail;
  return HEALTH;
}
// run a whitelisted tool as a job; when it ends, `after` refreshes the page
async function runTool(data, after) { try { await api('/api/ws/run', 'POST', data); startLog(); ONDONE = after || null; toast('เริ่มงานแล้ว: ดูความคืบหน้าที่แถบด้านล่าง'); } catch (e) { alert(e.message); } }
const statusList = items => `<div class="grid g3">${items.map(x => `<div class="stat ${x.ok ? '' : 'no'}"><i class="d"></i><div><b>${esc(x.name)}</b><span>${esc(x.detail)}</span></div></div>`).join('')}</div>`;

const VIEWS = {};
// ---------- home ----------
VIEWS.home = async () => {
  const [h, v, r] = await Promise.all([refreshHealth(), api('/api/ws/videos'), api('/api/ws/renders')]);
  const bad = h.items.filter(x => !x.ok);
  $('#page').innerHTML = `
  ${bad.length ? `<div class="alert warn">ยังมี ${bad.length} ส่วนที่ไม่พร้อม: ${bad.map(x => esc(x.name)).join(', ')} · <a href="#connections">ดูวิธีแก้</a></div>` : '<div class="alert ok">ทุกส่วนพร้อมใช้งาน</div>'}
  <div class="grid g4" style="margin-bottom:16px">
    <a class="tile" href="#projects"><div class="ic">🎬</div><b>สร้างวิดีโอใหม่</b><span>เล่าเรื่องเป็นภาษาไทย ให้ Opus กำกับทั้งเรื่อง</span></a>
    <a class="tile" href="#characters"><div class="ic">🧍</div><b>ทำตัวละครให้ขยับ</b><span>ใส่ภาพตัวละคร แล้วสั่ง เดิน วิ่ง โบกมือ</span></a>
    <a class="tile" href="#render"><div class="ic">🎞️</div><b>เรนเดอร์วิดีโอ</b><span>${r.jobs.length} งาน · ${r.fixtures.length} แผนตัวอย่าง</span></a>
    <a class="tile" href="#health"><div class="ic">🩺</div><b>ตรวจทั้งระบบ</b><span>ทดสอบจริงแล้วสรุปผ่าน/ไม่ผ่าน</span></a>
  </div>
  <div class="card"><h2>สถานะระบบ</h2><p class="lead">ตรวจทุก 20 วินาทีเมื่อเปิดหน้านี้</p>${statusList(h.items)}</div>

function thaiError(e) {
  const miss = [...new Set((e.match(/missing: [^\s]+\.png/g) || []).map(x => x.slice(9).split('/').pop()))];
  let th = 'เกิดปัญหา';
  if (/asset validation failed/.test(e)) th = `ภาพประกอบยังขาด${miss.length ? ` ${miss.length} ภาพ (${miss.join(', ')})` : 'หรือไม่ผ่านการตรวจ'} → ไปที่หน้า <a href="#artwork">ภาพประกอบ</a> กด "สร้างภาพที่ขาด" (ต้องเปิด ComfyUI) แล้วกลับมาเรนเดอร์`;
  else if (/segment\(s\) failed/.test(e)) th = `บางฉากไม่ผ่าน (${esc((e.match(/failed: ([^.]+)\./) || [])[1] || '')}) → กด "แก้เฉพาะฉากที่พัง" ฉากที่ผ่านแล้วจะไม่ทำซ้ำ · ถ้าฉากนิ่งทั้งที่ควรขยับ ให้ตรวจภาพประกอบของฉากนั้น`;
  else if (/Chrome not found/.test(e)) th = 'ไม่พบ Google Chrome → ติดตั้ง Chrome หรือบอกที่อยู่ในหน้า ตั้งค่า';
  else if (/ffmpeg not found/.test(e)) th = 'ไม่พบ ffmpeg → ติดตั้ง ffmpeg แล้วเพิ่มใน PATH';
  return `<div class="alert bad">${th}<details><summary class="small">รายละเอียดจากเครื่องมือ</summary><div class="small" style="white-space:pre-wrap">${esc(e)}</div></details></div>`;
}

function initRigCanvas() {
  const c = $('#rig'), R = RIG; IMG = new Image(); IMG.src = R.image;
  IMG.onload = () => { SCALE = Math.min(1, 560 / IMG.height, 620 / IMG.width); c.width = IMG.width * SCALE; c.height = IMG.height * SCALE; drawRig(); };
  const at = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * c.width / b.width / SCALE, (e.clientY - b.top) * c.height / b.height / SCALE]; };
  c.onpointerdown = e => { const [x, y] = at(e); let best = null, bd = 18 / SCALE; for (const [n, j] of Object.entries(R.joints)) { const d = Math.hypot(j.x - x, j.y - y); if (d < bd) { bd = d; best = n; } } if (best) { DRAG = best; c.setPointerCapture(e.pointerId); c.style.cursor = 'grabbing'; } };
  c.onpointermove = e => { if (!DRAG) return; const [x, y] = at(e); R.joints[DRAG] = { ...R.joints[DRAG], x, y, confidence: 'manual' }; EDITED[DRAG] = { x, y }; drawRig(); $('#rigmsg').textContent = `แก้แล้ว ${Object.keys(EDITED).length} จุด (ยังไม่บันทึก)`; };
  c.onpointerup = () => { DRAG = null; c.style.cursor = 'grab'; };
}
function drawRig() {
  const c = $('#rig'), x = c.getContext('2d'), R = RIG, s = SCALE; x.clearRect(0, 0, c.width, c.height); x.drawImage(IMG, 0, 0, c.width, c.height);
  x.lineCap = 'round'; x.strokeStyle = 'rgba(40,70,220,.85)'; x.lineWidth = 3;
  for (const [a, b] of R.bones) { const A = R.joints[a], B = R.joints[b]; if (A && B) { x.beginPath(); x.moveTo(A.x * s, A.y * s); x.lineTo(B.x * s, B.y * s); x.stroke(); } }
  for (const [n, j] of Object.entries(R.joints)) { x.fillStyle = '#fff'; x.beginPath(); x.arc(j.x * s, j.y * s, 8, 0, 7); x.fill(); x.fillStyle = CONFCOL[j.confidence] || '#888'; x.beginPath(); x.arc(j.x * s, j.y * s, 5.5, 0, 7); x.fill(); }
  if (DRAG) { const j = R.joints[DRAG]; x.font = '600 13px Sarabun, sans-serif'; x.fillStyle = '#1F1D24'; x.fillText(DRAG, j.x * s + 10, j.y * s - 10); }
}

    subtitles: $('#f-subs').checked, sfx: $('#f-sfx').checked, polish: $('#f-polish').checked,
    footage: $$('.clip').map(r => ({ path: r.querySelector('.c-path').value.trim(), name: r.querySelector('.c-name').value.trim(), description: r.querySelector('.c-desc').value,
      start: +r.querySelector('.c-start').value || 0, end: +r.querySelector('.c-end').value || undefined })).filter(c => c.path && c.name) };
}
async function saveProject() { try { VIEW = await api('/api/project', 'POST', projectForm()); const was = CUR; CUR = VIEW.project.id; await refreshState(); toast('บันทึกแล้ว'); if (!was) location.hash = '#projects/' + CUR; else renderProject(); } catch (e) { alert(e.message); } }
async function act(a, data = {}) { try { await api('/api/project', 'POST', projectForm()); await api(`/api/project/${CUR}/${a}`, 'POST', data); startLog(); toast('เริ่มงานแล้ว'); } catch (e) { alert(e.message); } }
function autoProject() { act('auto', { mode: $('#o-test').checked ? 'test' : 'opus', art: $('#o-mock').checked ? 'mock' : 'gen', review: $('#o-review').checked && !$('#o-test').checked, render: $('#o-render').checked }); }
async function saveNarr() { const M = VIEW.manifest; $$('.narr').forEach(t => M.shots[+t.dataset.i].narration = t.value); VIEW = await api(`/api/project/${CUR}/manifest`, 'PUT', M); toast('บันทึกแล้ว'); renderProject(); }

// ---------- job bar ----------
function toggleLog() { const j = $('#jobbar'); j.classList.toggle('open'); $('#logbtn').textContent = j.classList.contains('open') ? 'ซ่อนบันทึก ▾' : 'ดูบันทึก ▴'; const L = $('#log'); L.scrollTop = L.scrollHeight; }
function startLog() { LOGN = 0; LOGTEXT = ''; $('#log').textContent = ''; pollJob.was = 'running'; if (!$('#jobbar').classList.contains('open')) toggleLog(); pollJob(); }
async function stopJob() { await api('/api/job/stop', 'POST'); }
async function pollJob() {
  clearTimeout(POLL);
  try {
    const j = await api('/api/job?from=' + LOGN), L = $('#log');
    if (j.total < LOGN) { LOGN = 0; LOGTEXT = ''; }
    if (j.log.length) { LOGTEXT += j.log.join('\n') + '\n'; L.textContent = LOGTEXT; L.scrollTop = L.scrollHeight; } LOGN = j.total;
    $('#jdot').className = 'dot ' + j.status;
    $('#jname').textContent = j.status === 'idle' ? 'ว่าง: ยังไม่มีงานที่กำลังทำ' : `${j.name} · ${j.step || ''} · ${({ running: 'กำลังทำงาน…', done: 'เสร็จแล้ว ✔', failed: 'มีปัญหา ✖ (ดูบันทึก)' })[j.status] || j.status}`;
    if (j.status === 'running') POLL = setTimeout(pollJob, 800);
    else if (pollJob.was === 'running') { if (j.status === 'done') toast('งานเสร็จแล้ว'); const f = ONDONE; ONDONE = null; if (f) f(); }
    pollJob.was = j.status;
  } catch (e) { POLL = setTimeout(pollJob, 2000); }
}
async function quit() { if (!confirm('ปิดโปรแกรมสตูดิโอ? (งานที่กำลังทำจะหยุด)')) return; await api('/api/ws/shutdown', 'POST').catch(() => {}); document.body.innerHTML = '<div class="empty" style="grid-column:1/-1;padding-top:120px"><h2>ปิดโปรแกรมแล้ว</h2><p>ดับเบิลคลิก "สตูดิโอแอนิเมชัน" เพื่อเปิดใหม่ได้ทุกเมื่อ</p></div>'; }

// ---------- start ----------
(async () => {
  const p = new URLSearchParams(location.search).get('p'); if (p && !location.hash) location.hash = '#projects/' + p;
  await refreshState(); refreshHealth().catch(() => {}); route(); pollJob();
  setInterval(() => { if (!$('#rig')) refreshHealth().catch(() => {}); }, 20000);
})();
</script>
