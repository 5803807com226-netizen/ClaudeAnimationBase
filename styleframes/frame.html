<!doctype html><html><head><meta charset="utf-8"><title>Style frame</title>
<style>html,body{margin:0;background:#111}canvas{display:block;height:96vh;width:auto;margin:2vh auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
  // frame.html?s=a|b|c loads that study, which paints the canvas and sets window.done.
  const S = (new URLSearchParams(location.search).get('s') || 'a').replace(/[^a-z]/g, '');
  document.write(`<script src="${S}.js"><\/script>`);
</script>
</body></html>
